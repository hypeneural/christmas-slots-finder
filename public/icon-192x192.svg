<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" fill="none">
  <!-- Background with Christmas gradient -->
  <rect width="192" height="192" rx="24" fill="url(#christmasGradient)"/>
  
  <!-- Christmas tree -->
  <g transform="translate(96, 120)">
    <!-- Tree trunk -->
    <rect x="-4" y="20" width="8" height="16" fill="#8B4513" rx="2"/>
    
    <!-- Tree layers -->
    <path d="M-30 20 L0 -40 L30 20 Z" fill="#228B22"/>
    <path d="M-25 5 L0 -25 L25 5 Z" fill="#32CD32"/>
    <path d="M-20 -10 L0 -10 L20 -10 Z" fill="#90EE90"/>
    
    <!-- Star on top -->
    <path d="M0 -50 L4 -40 L14 -40 L6 -32 L10 -22 L0 -30 L-10 -22 L-6 -32 L-14 -40 L-4 -40 Z" fill="#FFD700"/>
    
    <!-- Ornaments -->
    <circle cx="-15" cy="-5" r="3" fill="#FF0000"/>
    <circle cx="15" cy="-5" r="3" fill="#FF0000"/>
    <circle cx="0" cy="0" r="3" fill="#FFD700"/>
    <circle cx="-8" cy="8" r="2" fill="#0000FF"/>
    <circle cx="8" cy="8" r="2" fill="#0000FF"/>
  </g>
  
  <!-- Snowflakes -->
  <g opacity="0.7">
    <path d="M20 30 L20 40 M15 35 L25 35 M17 32 L23 38 M23 32 L17 38" stroke="white" stroke-width="1"/>
    <path d="M160 50 L160 60 M155 55 L165 55 M157 52 L163 58 M163 52 L157 58" stroke="white" stroke-width="1"/>
    <path d="M40 150 L40 160 M35 155 L45 155 M37 152 L43 158 M43 152 L37 158" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- App title -->
  <text x="96" y="180" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">NATAL</text>
  
  <defs>
    <linearGradient id="christmasGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1b1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f0f;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
