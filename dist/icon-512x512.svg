<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Background with Christmas gradient -->
  <rect width="512" height="512" rx="64" fill="url(#christmasGradient)"/>
  
  <!-- Christmas tree -->
  <g transform="translate(256, 320)">
    <!-- Tree trunk -->
    <rect x="-12" y="50" width="24" height="40" fill="#8B4513" rx="6"/>
    
    <!-- Tree layers -->
    <path d="M-80 50 L0 -100 L80 50 Z" fill="#228B22"/>
    <path d="M-65 15 L0 -65 L65 15 Z" fill="#32CD32"/>
    <path d="M-50 -25 L0 -25 L50 -25 Z" fill="#90EE90"/>
    
    <!-- Star on top -->
    <path d="M0 -130 L12 -100 L42 -100 L18 -76 L30 -46 L0 -70 L-30 -46 L-18 -76 L-42 -100 L-12 -100 Z" fill="#FFD700"/>
    
    <!-- Ornaments -->
    <circle cx="-40" cy="-15" r="8" fill="#FF0000"/>
    <circle cx="40" cy="-15" r="8" fill="#FF0000"/>
    <circle cx="0" cy="0" r="8" fill="#FFD700"/>
    <circle cx="-20" cy="20" r="6" fill="#0000FF"/>
    <circle cx="20" cy="20" r="6" fill="#0000FF"/>
    <circle cx="-30" cy="5" r="5" fill="#FF69B4"/>
    <circle cx="30" cy="5" r="5" fill="#FF69B4"/>
  </g>
  
  <!-- Snowflakes -->
  <g opacity="0.7">
    <path d="M50 80 L50 100 M40 90 L60 90 M45 85 L55 95 M55 85 L45 95" stroke="white" stroke-width="2"/>
    <path d="M430 130 L430 150 M420 140 L440 140 M425 135 L435 145 M435 135 L425 145" stroke="white" stroke-width="2"/>
    <path d="M100 400 L100 420 M90 410 L110 410 M95 405 L105 415 M105 405 L95 415" stroke="white" stroke-width="2"/>
    <path d="M400 350 L400 370 M390 360 L410 360 M395 355 L405 365 M405 355 L395 365" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- App title -->
  <text x="256" y="480" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">FOTOS DE NATAL</text>
  
  <defs>
    <linearGradient id="christmasGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1b1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f0f;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
